spring:
  application:
    name: devedu-learning-platform
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
    test-connection: false
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

security:
  jwt:
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
    expiration: ${JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://devedu-2.onrender.com}
  bootstrap-admin:
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-base-uri: ${OAUTH_REDIRECT_BASE_URI:http://localhost:5173/login/oauth2/code}
    frontend-callback-uri: ${OAUTH_FRONTEND_CALLBACK_URI:https://devedu-2.onrender.com/auth/callback}

devedu:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout: ${GEMINI_TIMEOUT:PT45S}
    suggestion-timeout: ${GEMINI_SUGGESTION_TIMEOUT:PT8S}
  email-verification:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@devedu.local}
    ttl: ${EMAIL_VERIFICATION_TTL:PT10M}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

judge:
  docker-command: ${JUDGE_DOCKER_COMMAND:docker}
  workspace-root: ${JUDGE_WORKSPACE_ROOT:${java.io.tmpdir}}
  workspace-volume: ${JUDGE_WORKSPACE_VOLUME:}
  images:
    cpp: ${JUDGE_CPP_IMAGE:gcc:14.4}
    java: ${JUDGE_JAVA_IMAGE:eclipse-temurin:17-jdk-alpine-3.23}
    python: ${JUDGE_PYTHON_IMAGE:python:3.13-alpine}
    html: ${JUDGE_HTML_IMAGE:alpine:3.23}
    mysql: ${JUDGE_MYSQL_IMAGE:mysql:8.4}
  limits:
    memory: ${JUDGE_MEMORY:384m}
    mysql-memory: ${JUDGE_MYSQL_MEMORY:512m}
    cpus: ${JUDGE_CPUS:1.0}
    pids: ${JUDGE_PIDS:64}
    output-bytes: ${JUDGE_OUTPUT_BYTES:1048576}
    compile-timeout-ms: ${JUDGE_COMPILE_TIMEOUT_MS:20000}
    execution-timeout-ms: ${JUDGE_EXECUTION_TIMEOUT_MS:3000}
    startup-grace-ms: ${JUDGE_STARTUP_GRACE_MS:1000}
    mysql-startup-grace-ms: ${JUDGE_MYSQL_STARTUP_GRACE_MS:20000}
    max-concurrent-executions: ${JUDGE_MAX_CONCURRENT_EXECUTIONS:2}

server:
  port: ${PORT:${SERVER_PORT:8080}}
