services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devedu}
      POSTGRES_USER: ${POSTGRES_USER:-devedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devedu}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devedu} -d ${POSTGRES_DB:-devedu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devedu}
      - DB_USERNAME=${POSTGRES_USER:-devedu}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-devedu}
      - CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-5173}
      - JUDGE_WORKSPACE_ROOT=/judge-workspaces
      - JUDGE_WORKSPACE_VOLUME=devedu_judge_workspaces
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-P7D}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_BASE_URI=http://localhost:${FRONTEND_PORT:-5173}/login/oauth2/code
      - OAUTH_FRONTEND_CALLBACK_URI=http://localhost:${FRONTEND_PORT:-5173}/auth/callback
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_workspaces:/judge-workspaces
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/system/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  judge_workspaces:
    name: devedu_judge_workspaces
